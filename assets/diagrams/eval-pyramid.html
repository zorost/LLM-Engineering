<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluation pyramid · LLM Engineering</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #EEF1F4;
      --color-ink: #11161D;
      --color-muted: #5A6672;
      --color-accent: #FF3621;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pyramid · Zorost Intelligence</p>
    <h1>Unit checks at the base. Outcomes at the apex.</h1>
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eval-pyramid-title eval-pyramid-desc">
      
      <title id="eval-pyramid-title">Evaluation pyramid</title>
      <desc id="eval-pyramid-desc">Pyramid from unit checks at the base up to production outcomes at the apex, which is the focal layer.</desc>
      <defs>
        <pattern id="dots-eval-pyramid" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(17,22,29,0.10)"/>
        </pattern>
        <marker id="arrow-eval-pyramid" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5A6672"/>
        </marker>
        <marker id="arrow-accent-eval-pyramid" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#FF3621"/>
        </marker>
        <marker id="arrow-link-eval-pyramid" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0A7F7A"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#EEF1F4"/>
      <rect width="100%" height="100%" fill="url(#dots-eval-pyramid)" opacity="0.55"/>

      <text x="40" y="72" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">RARER</text>
      <polygon points="344,80 656,80 680,136 320,136" fill="rgba(255,54,33,0.08)" stroke="#FF3621" stroke-width="1"/><text x="500.0" y="108" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Production outcomes</text><text x="500.0" y="124" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the only score that pays</text><polygon points="284,148 716,148 740,204 260,204" fill="#FFFFFF" stroke="rgba(17,22,29,0.20)" stroke-width="1"/><text x="500.0" y="176" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human review</text><text x="500.0" y="192" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sampled, expensive</text><polygon points="224,216 776,216 800,272 200,272" fill="#FFFFFF" stroke="rgba(17,22,29,0.20)" stroke-width="1"/><text x="500.0" y="244" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Judge models</text><text x="500.0" y="260" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">biased, still useful</text><polygon points="164,284 836,284 860,340 140,340" fill="#FFFFFF" stroke="rgba(17,22,29,0.20)" stroke-width="1"/><text x="500.0" y="312" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Golden sets</text><text x="500.0" y="328" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frozen, rerunnable</text><polygon points="104,352 896,352 920,408 80,408" fill="#FFFFFF" stroke="rgba(17,22,29,0.20)" stroke-width="1"/><text x="500.0" y="380" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Unit checks</text><text x="500.0" y="396" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">schema, citations, regex</text>
      <line x1="32" y1="432" x2="968" y2="432" stroke="rgba(17,22,29,0.10)" stroke-width="0.8"/>
<text x="32" y="452" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="442" width="12" height="12" rx="2" fill="rgba(255,54,33,0.08)" stroke="#FF3621"/>
<text x="140" y="452" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace">What pays</text>
<rect x="280" y="442" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#11161D"/>
<text x="300" y="452" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace">Supporting evals</text>
    </svg>
  </div>
</body>
</html>
