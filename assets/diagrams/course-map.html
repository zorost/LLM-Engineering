<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five tracks · LLM Engineering</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #EEF1F4;
      --color-ink: #11161D;
      --color-muted: #5A6672;
      --color-accent: #FF3621;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Zorost Intelligence</p>
    <h1>Five tracks. Engineer is the default working path.</h1>
    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-map-title course-map-desc">
      
      <title id="course-map-title">Five tracks of LLM engineering</title>
      <desc id="course-map-desc">Tree from LLM Engineering to Fundamentals, Scientist, Engineer, Operator, and Leader, with Engineer as the default working path.</desc>
      <defs>
        <pattern id="dots-course-map" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(17,22,29,0.10)"/>
        </pattern>
        <marker id="arrow-course-map" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5A6672"/>
        </marker>
        <marker id="arrow-accent-course-map" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#FF3621"/>
        </marker>
        <marker id="arrow-link-course-map" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0A7F7A"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#EEF1F4"/>
      <rect width="100%" height="100%" fill="url(#dots-course-map)" opacity="0.55"/>

      <line x1="500" y1="96" x2="500" y2="160" stroke="#5A6672" stroke-width="1.2"/>
      <line x1="88" y1="160" x2="912" y2="160" stroke="#5A6672" stroke-width="1.2"/>
      <line x1="120" y1="160" x2="120" y2="196" stroke="#5A6672" stroke-width="1.2" marker-end="url(#arrow-course-map)"/>
      <line x1="312" y1="160" x2="312" y2="196" stroke="#5A6672" stroke-width="1.2" marker-end="url(#arrow-course-map)"/>
      <line x1="500" y1="160" x2="500" y2="196" stroke="#FF3621" stroke-width="1.2" marker-end="url(#arrow-accent-course-map)"/>
      <line x1="688" y1="160" x2="688" y2="196" stroke="#5A6672" stroke-width="1.2" marker-end="url(#arrow-course-map)"/>
      <line x1="880" y1="160" x2="880" y2="196" stroke="#5A6672" stroke-width="1.2" marker-end="url(#arrow-course-map)"/>
      <rect x="420" y="48" width="160" height="48" rx="6" fill="#EEF1F4"/>
<rect x="420" y="48" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#11161D" stroke-width="1"/>
<rect x="428" y="54" width="36" height="12" rx="2" fill="transparent" stroke="#11161D" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="446.0" y="63" fill="#11161D" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
<text x="500.0" y="80" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM Engineering</text>
<text x="500.0" y="96" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Training 02</text>
      <rect x="40" y="200" width="160" height="56" rx="6" fill="#EEF1F4"/>
<rect x="40" y="200" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#11161D" stroke-width="1"/>
<rect x="48" y="206" width="36" height="12" rx="2" fill="transparent" stroke="#11161D" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="66.0" y="215" fill="#11161D" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">F0</text>
<text x="120.0" y="232" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fundamentals</text>
<text x="120.0" y="248" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">math to hardware</text>
      <rect x="232" y="200" width="160" height="56" rx="6" fill="#EEF1F4"/>
<rect x="232" y="200" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#11161D" stroke-width="1"/>
<rect x="240" y="206" width="36" height="12" rx="2" fill="transparent" stroke="#11161D" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="258.0" y="215" fill="#11161D" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S</text>
<text x="312.0" y="232" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scientist</text>
<text x="312.0" y="248" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">make the weights</text>
      <rect x="420" y="200" width="160" height="56" rx="6" fill="#EEF1F4"/>
<rect x="420" y="200" width="160" height="56" rx="6" fill="rgba(255,54,33,0.08)" stroke="#FF3621" stroke-width="1"/>
<rect x="428" y="206" width="36" height="12" rx="2" fill="transparent" stroke="#FF3621" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="446.0" y="215" fill="#FF3621" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">E</text>
<text x="500.0" y="232" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Engineer</text>
<text x="500.0" y="248" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">default working path</text>
      <rect x="608" y="200" width="160" height="56" rx="6" fill="#EEF1F4"/>
<rect x="608" y="200" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#11161D" stroke-width="1"/>
<rect x="616" y="206" width="36" height="12" rx="2" fill="transparent" stroke="#11161D" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="634.0" y="215" fill="#11161D" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">O</text>
<text x="688.0" y="232" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator</text>
<text x="688.0" y="248" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">serve and observe</text>
      <rect x="800" y="200" width="160" height="56" rx="6" fill="#EEF1F4"/>
<rect x="800" y="200" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#11161D" stroke-width="1"/>
<rect x="808" y="206" width="36" height="12" rx="2" fill="transparent" stroke="#11161D" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="826.0" y="215" fill="#11161D" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L</text>
<text x="880.0" y="232" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Leader</text>
<text x="880.0" y="248" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">buy, staff, kill</text>
      <rect x="232" y="300" width="160" height="48" rx="6" fill="#EEF1F4"/>
<rect x="232" y="300" width="160" height="48" rx="6" fill="rgba(17,22,29,0.05)" stroke="#5A6672" stroke-width="1"/>
<rect x="240" y="306" width="36" height="12" rx="2" fill="transparent" stroke="#5A6672" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="258.0" y="315" fill="#5A6672" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAB</text>
<text x="312.0" y="332" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Labs 00 to 19</text>
<text x="312.0" y="348" fill="#5A6672" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CPU, no API key</text>
      <line x1="500" y1="256" x2="500" y2="280" stroke="#5A6672" stroke-width="1"/>
      <line x1="312" y1="280" x2="688" y2="280" stroke="#5A6672" stroke-width="1"/>
      <line x1="312" y1="280" x2="312" y2="296" stroke="#5A6672" stroke-width="1.2" marker-end="url(#arrow-course-map)"/>
      <line x1="32" y1="400" x2="968" y2="400" stroke="rgba(17,22,29,0.10)" stroke-width="0.8"/>
<text x="32" y="420" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="410" width="12" height="12" rx="2" fill="rgba(255,54,33,0.08)" stroke="#FF3621"/>
<text x="140" y="420" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace">Default path</text>
<rect x="280" y="410" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#11161D"/>
<text x="300" y="420" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace">Track</text>
<rect x="440" y="410" width="12" height="12" rx="2" fill="rgba(17,22,29,0.05)" stroke="#5A6672"/>
<text x="460" y="420" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace">Labs</text>
    </svg>
  </div>
</body>
</html>
