<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM layers · LLM Engineering</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #EEF1F4;
      --color-ink: #11161D;
      --color-muted: #5A6672;
      --color-accent: #FF3621;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Zorost Intelligence</p>
    <h1>LLM work, from silicon to the boardroom</h1>
    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="llm-layers-title llm-layers-desc">
      
      <title id="llm-layers-title">LLM work from silicon to the boardroom</title>
      <desc id="llm-layers-desc">Layer stack from serving silicon up through weights, post-training, context, applications, and leadership, with context and retrieval as the focal layer.</desc>
      <defs>
        <pattern id="dots-llm-layers" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(17,22,29,0.10)"/>
        </pattern>
        <marker id="arrow-llm-layers" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5A6672"/>
        </marker>
        <marker id="arrow-accent-llm-layers" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#FF3621"/>
        </marker>
        <marker id="arrow-link-llm-layers" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#0A7F7A"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#EEF1F4"/>
      <rect width="100%" height="100%" fill="url(#dots-llm-layers)" opacity="0.55"/>

      <text x="48" y="64" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BOARD</text>
      <line x1="80" y1="80" x2="80" y2="464" stroke="rgba(17,22,29,0.30)" stroke-width="1"/>
      <polygon points="76,80 84,80 80,72" fill="#5A6672"/>
      <text x="40" y="488" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SILICON</text>
      <rect x="120" y="80" width="840" height="64" fill="#FFFFFF" /><line x1="120" y1="144" x2="960" y2="144" stroke="rgba(17,22,29,0.12)" stroke-width="1"/><text x="140" y="116" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text><text x="260" y="118" fill="#11161D" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Leadership and product</text><text x="940" y="118" fill="#5A6672" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">kill criteria, staff, risk</text><rect x="120" y="144" width="840" height="64" fill="#FFFFFF" /><line x1="120" y1="208" x2="960" y2="208" stroke="rgba(17,22,29,0.12)" stroke-width="1"/><text x="140" y="180" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text><text x="260" y="182" fill="#11161D" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Applications and agents</text><text x="940" y="182" fill="#5A6672" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">tools, MCP, eval gates</text><rect x="120" y="208" width="840" height="64" fill="rgba(255,54,33,0.08)" stroke="#FF3621" stroke-width="1"/><text x="140" y="244" fill="#FF3621" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text><text x="260" y="246" fill="#11161D" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Context and retrieval</text><text x="940" y="246" fill="#FF3621" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">the window is the product</text><rect x="120" y="272" width="840" height="64" fill="#FFFFFF" /><line x1="120" y1="336" x2="960" y2="336" stroke="rgba(17,22,29,0.12)" stroke-width="1"/><text x="140" y="308" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text><text x="260" y="310" fill="#11161D" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Post-training</text><text x="940" y="310" fill="#5A6672" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">SFT, preference, reasoning</text><rect x="120" y="336" width="840" height="64" fill="#FFFFFF" /><line x1="120" y1="400" x2="960" y2="400" stroke="rgba(17,22,29,0.12)" stroke-width="1"/><text x="140" y="372" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text><text x="260" y="374" fill="#11161D" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Pre-training weights</text><text x="940" y="374" fill="#5A6672" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">data, parallel, loss</text><rect x="120" y="400" width="840" height="64" fill="#FFFFFF" /><line x1="120" y1="464" x2="960" y2="464" stroke="rgba(17,22,29,0.12)" stroke-width="1"/><text x="140" y="436" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L0</text><text x="260" y="438" fill="#11161D" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Silicon and serving</text><text x="940" y="438" fill="#5A6672" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">VRAM, engines, tokens</text>
      <line x1="32" y1="500" x2="968" y2="500" stroke="rgba(17,22,29,0.10)" stroke-width="0.8"/>
<text x="32" y="520" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="510" width="12" height="12" rx="2" fill="rgba(255,54,33,0.08)" stroke="#FF3621"/>
<text x="140" y="520" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace">Focal layer</text>
<rect x="280" y="510" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#11161D"/>
<text x="300" y="520" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace">Other layers</text>
    </svg>
  </div>
</body>
</html>
